<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Demo Access | Medvika Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3f7f5;color:#17372f}.bar{background:#0b493c;color:#fff;padding:17px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800}.wrap{width:min(1180px,calc(100% - 28px));margin:28px auto}.card{background:#fff;border:1px solid #d9e6e1;border-radius:16px;padding:22px}.login{max-width:430px;margin:70px auto}.login input{width:100%;margin:7px 0 13px;border:1px solid #c8dbd4;border-radius:10px;padding:12px;font:inherit}.btn{border:0;border-radius:9px;padding:10px 14px;background:#087659;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#eef7f3;color:#087659}.btn.danger{background:#fff0ee;color:#9b2c21}.btn:disabled{opacity:.5}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.tabs{display:flex;gap:8px}.tab{background:#fff;border:1px solid #cfe0da;color:#45645a}.tab.active{background:#087659;color:#fff}.list{display:grid;gap:12px}.lead{background:#fff;border:1px solid #d9e6e1;border-radius:14px;padding:18px}.lead-head{display:flex;justify-content:space-between;gap:14px}.lead h3{margin:0 0 5px}.meta{color:#60706b;font-size:13px}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.detail{background:#f4f8f6;border-radius:9px;padding:10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions select{padding:9px;border:1px solid #c8dbd4;border-radius:8px}.linkbox{margin-top:12px;background:#eaf8f2;padding:12px;border-radius:9px;word-break:break-all;font-size:12px}.status{padding:5px 9px;border-radius:20px;background:#fff1d6;color:#855700;font-size:11px;font-weight:800}.status.approved{background:#e5f7ef;color:#087659}.status.rejected{background:#fff0ee;color:#9b2c21}.empty{text-align:center;color:#60706b;padding:50px}.error{color:#a12d24}@media(max-width:760px){.details{grid-template-columns:1fr 1fr}.lead-head,.toolbar{align-items:flex-start;flex-direction:column}}@media(max-width:430px){.details{grid-template-columns:1fr}}
</style></head><body><header class="bar"><div class="brand">Medvika Admin</div><button class="btn alt" id="logout" style="display:none">Sign out</button></header><main class="wrap"><section class="card login" id="login"><h1>Demo approvals</h1><p>Sign in with an active Medvika super-admin account.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn">Sign in</button><p id="loginMsg" class="error"></p></form></section><section id="panel" style="display:none"><div class="toolbar"><div><h1 style="margin:0">Demo access requests</h1><p class="meta">Review leads, approve time-limited access and copy the unique link. Pilot access defaults to 3 days.</p></div><div class="tabs"><button class="btn tab active" data-status="pending">Pending</button><button class="btn tab" data-status="approved">Approved</button><button class="btn tab" data-status="rejected">Rejected</button></div></div><div id="list" class="list"></div></section></main>
<script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const db=createClient("https://geqrrrzbvemraiyqyxnc.supabase.co","sb_publishable_dgN1GE1pYUs2PW-0zm2W8g_nRP_41Io");let current="pending";const login=document.getElementById("login"),panel=document.getElementById("panel"),logout=document.getElementById("logout"),list=document.getElementById("list");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function boot(){const{data:{session}}=await db.auth.getSession();if(session){login.style.display="none";panel.style.display="block";logout.style.display="block";load();}}async function load(){list.innerHTML='<div class="empty">Loading…</div>';const{data,error}=await db.from("demo_access_requests").select("*").eq("status",current).order("requested_at",{ascending:false});if(error){list.innerHTML='<div class="card error">Access denied. This panel requires an active super-admin account.</div>';return}if(!data.length){list.innerHTML='<div class="card empty">No '+current+' requests.</div>';return}list.innerHTML=data.map(r=>'<article class="lead" data-id="'+r.id+'"><div class="lead-head"><div><h3>'+esc(r.full_name)+'</h3><div class="meta">'+esc(r.pharmacy_name)+' · '+esc(r.city)+'</div></div><span class="status '+r.status+'">'+r.status.toUpperCase()+'</span></div><div class="details"><div class="detail"><b>Mobile</b><br>'+esc(r.mobile)+'</div><div class="detail"><b>Email</b><br>'+esc(r.email||"—")+'</div><div class="detail"><b>Stores</b><br>'+r.store_count+'</div><div class="detail"><b>Requested</b><br>'+new Date(r.requested_at).toLocaleString()+'</div></div>'+(r.requirement?'<p class="meta"><b>Requirement:</b> '+esc(r.requirement)+'</p>':'')+(r.status==="pending"?'<div class="actions"><select class="duration"><option value="72" selected>3 days (pilot)</option><option value="24">24 hours</option><option value="168">7 days</option></select><button class="btn approve">Approve & create link</button><button class="btn danger reject">Reject</button></div>':'')+'</article>').join("");document.querySelectorAll(".approve").forEach(b=>b.onclick=()=>approve(b.closest(".lead")));document.querySelectorAll(".reject").forEach(b=>b.onclick=()=>reject(b.closest(".lead")));}function makeToken(){const a=new Uint8Array(32);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,"0")).join("")}async function approve(el){const token=makeToken(),hours=Number(el.querySelector(".duration").value||72),btn=el.querySelector(".approve");btn.disabled=true;const{data,error}=await db.rpc("approve_demo_access_request",{p_request_id:el.dataset.id,p_token:token,p_duration_hours:hours});if(error){alert(error.message);btn.disabled=false;return}const url=location.origin+"/pharmacy-operations/demo/?access="+token;const box=document.createElement("div");box.className="linkbox";box.innerHTML="<b>Approved until "+new Date(data).toLocaleString()+"</b><br>"+esc(url)+'<br><button class="btn alt copy" style="margin-top:8px">Copy access link</button>';el.appendChild(box);box.querySelector(".copy").onclick=async()=>{await navigator.clipboard.writeText(url);box.querySelector(".copy").textContent="Copied";};btn.textContent="Approved";}async function reject(el){if(!confirm("Reject this demo request?"))return;const{error}=await db.rpc("reject_demo_access_request",{p_request_id:el.dataset.id});if(error)alert(error.message);else load();}document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("loginMsg");m.textContent="";const{error}=await db.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});if(error)m.textContent=error.message;else boot();};logout.onclick=async()=>{await db.auth.signOut();location.reload();};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");current=b.dataset.status;load();});boot();</script></body></html>
