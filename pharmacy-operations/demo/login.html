<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Login | Medvika Pharmacy Operations Management Solution</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f6f4;
    }

    .login-card {
      width: min(420px, 100%);
      padding: 28px;
      background: white;
      border: 1px solid #dbe5e1;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(15, 45, 63, 0.1);
    }

    .login-card img {
      display: block;
      max-width: 180px;
      max-height: 65px;
      margin: 0 auto 18px;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #17212b;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #667085;
    }

    label {
      display: block;
      margin-bottom: 15px;
      font-weight: 600;
      color: #344054;
    }

    input {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #cfdad6;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #0f8b68;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.65;
    }

    #loginMessage {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 9px;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>

  <main class="login-card">
    <img src="/logo.png" alt="Medvika">

    <h1>Medvika Pharmacy Operations Management Solution</h1>

    <p class="subtitle">
      Admins can use email. Staff can use their assigned username.
    </p>

    <form id="loginForm">
      <label>
        Email or Username
        <input
          id="loginIdentity"
          type="text"
          autocomplete="username"
          placeholder="Email address or staff username"
          autocapitalize="none"
          spellcheck="false"
          required
        >
      </label>

      <label>
        Password
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        >
      </label>

      <button id="loginButton" type="submit">
        Sign In
      </button>
    </form>

    <div id="loginMessage"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/core/supabase.js"></script>

  <script>
    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("loginMessage");

    function showError(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    async function checkExistingSession() {
      const {
        data: { session }
      } = await window.supabaseClient.auth.getSession();

      if (session) {
        window.location.href = "index.html";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.style.display = "none";
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const identity =
          document
            .getElementById("loginIdentity")
            .value
            .trim();

        const password =
          document
            .getElementById("loginPassword")
            .value;

        if (!identity || !password) {
          throw new Error("Email/username and password are required.");
        }

        /*
         * Existing admin users can continue signing in with email.
         * Staff usernames are authenticated by the erp-login Edge Function
         * because their internal Auth email contains organization context
         * that must not be constructed in browser code.
         */
        if (identity.includes("@")) {
          const { error } =
            await window.supabaseClient.auth
              .signInWithPassword({
                email: identity,
                password
              });

          if (error) throw error;
        } else {
          const { data, error } =
            await window.supabaseClient.functions.invoke(
              "erp-login",
              {
                body: {
                  username: identity.toLowerCase(),
                  password
                }
              }
            );

          if (error) {
            let text = "Invalid username or password.";

            try {
              if (
                error.context &&
                typeof error.context.json === "function"
              ) {
                const body = await error.context.json();
                if (body?.error) text = body.error;
              }
            } catch (_) {}

            throw new Error(text);
          }

          if (!data?.access_token || !data?.refresh_token) {
            throw new Error(
              data?.error || "Invalid username or password."
            );
          }

          const { error: sessionError } =
            await window.supabaseClient.auth.setSession({
              access_token: data.access_token,
              refresh_token: data.refresh_token
            });

          if (sessionError) throw sessionError;
        }

        window.location.href = "index.html";

      } catch (error) {
        showError(error.message);
      } finally {
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });

    checkExistingSession();
  </script>

</body>
</html>
