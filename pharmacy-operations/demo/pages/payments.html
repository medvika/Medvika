<section class="account-register-module">
  <section class="erp-card">
    <div class="module-heading">
      <div>
        <h2>Payments</h2>
        <p>Review supplier and purchase payments recorded in the ERP.</p>
      </div>
      <button id="paymentsRefreshButton" type="button">Refresh</button>
    </div>

    <div class="register-toolbar">
      <label>From<input id="paymentsFrom" type="date"></label>
      <label>To<input id="paymentsTo" type="date"></label>
      <label>Payment Mode
        <select id="paymentsMode">
          <option value="">All Modes</option>
          <option value="CASH">Cash</option>
          <option value="UPI">UPI</option>
          <option value="CARD">Card</option>
          <option value="BANK_TRANSFER">Bank Transfer</option>
          <option value="CHEQUE">Cheque</option>
          <option value="OTHER">Other</option>
        </select>
      </label>
      <label>Source
        <select id="paymentsSource">
          <option value="">All Payments</option>
          <option value="SUPPLIER PAYMENT">Supplier Payments</option>
          <option value="PURCHASE PAYMENT">Purchase Invoice Payments</option>
        </select>
      </label>
      <div class="toolbar-actions">
        <button id="paymentsApplyButton" type="button">Apply</button>
        <button id="paymentsExportButton" class="primary" type="button">Export CSV</button>
      </div>
    </div>
  </section>

  <section class="summary-grid">
    <div class="summary-card"><small>Total Payments</small><strong id="paymentsTotal">₹0.00</strong></div>
    <div class="summary-card"><small>Transactions</small><strong id="paymentsCount">0</strong></div>
    <div class="summary-card"><small>Cash</small><strong id="paymentsCash">₹0.00</strong></div>
    <div class="summary-card"><small>Non-Cash</small><strong id="paymentsDigital">₹0.00</strong></div>
  </section>

  <section class="erp-card">
    <div class="section-heading">
      <div><h3>Payment Register</h3><p>Supplier-wise payment history with invoice references.</p></div>
      <span id="paymentsResultCount" class="result-count">0 rows</span>
    </div>
    <div class="register-search"><input id="paymentsSearch" type="search" placeholder="Search supplier, payment no., invoice or reference"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Source</th><th>Supplier</th><th>Reference</th><th>Invoice</th><th>Mode</th><th>Transaction Ref</th><th>Amount</th></tr></thead>
        <tbody id="paymentsTable"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </section>
</section>
