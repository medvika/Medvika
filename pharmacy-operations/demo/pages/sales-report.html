<section class="report-module">
  <section class="erp-card">
    <div class="module-heading">
      <div><h2>Sales Report</h2><p>Invoice-wise sales performance with customer, payment and status details.</p></div>
      <button id="srRefresh" type="button">Refresh</button>
    </div>
    <div class="report-toolbar">
      <label>From<input id="srFrom" type="date"></label>
      <label>To<input id="srTo" type="date"></label>
      <label>Payment Status<select id="srFilter"><option value="">All</option><option value="paid">Paid</option><option value="partially_paid">Partially Paid</option><option value="unpaid">Unpaid</option><option value="cancelled">Cancelled</option></select></label>
      <div class="toolbar-actions">
        <button id="srApply" type="button">Apply</button>
        <button id="srExport" class="primary" type="button">Export CSV</button>
      </div>
    </div>
  </section>

  <section class="summary-grid">
    <div class="summary-card"><small id="srSum1Label">Metric 1</small><strong id="srSum1">0</strong></div>
    <div class="summary-card"><small id="srSum2Label">Metric 2</small><strong id="srSum2">0</strong></div>
    <div class="summary-card"><small id="srSum3Label">Metric 3</small><strong id="srSum3">0</strong></div>
    <div class="summary-card"><small id="srSum4Label">Metric 4</small><strong id="srSum4">0</strong></div>
  </section>

  <section class="erp-card">
    <div class="section-heading">
      <div><h3>Detailed Register</h3><p>Filtered report data from recorded ERP transactions.</p></div>
      <span id="srCount">0 rows</span>
    </div>
    <div class="report-search"><input id="srSearch" type="search" placeholder="Search report"></div>
    <div class="table-wrap"><table><thead id="srHead"></thead><tbody id="srBody"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody></table></div>
  </section>
</section>
