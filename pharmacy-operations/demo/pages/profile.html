<section class="profile-page">
  <div class="profile-card">
    <div class="profile-heading">
      <div>
        <h2>My Profile</h2>
        <p>View your ERP account, role and assigned pharmacy details.</p>
      </div>
      <span id="profileStatus" class="profile-status">Loading...</span>
    </div>

    <div class="profile-grid">
      <div class="profile-field">
        <span class="profile-label">Full Name</span>
        <strong id="profileFullName">—</strong>
      </div>

      <div class="profile-field">
        <span class="profile-label">Username</span>
        <strong id="profileUsername">—</strong>
      </div>

      <div class="profile-field">
        <span class="profile-label">Role</span>
        <strong id="profileRole">—</strong>
      </div>

      <div class="profile-field">
        <span class="profile-label">Mobile</span>
        <strong id="profileMobile">—</strong>
      </div>

      <div class="profile-field">
        <span class="profile-label">Assigned Branch / Pharmacy</span>
        <strong id="profilePharmacy">—</strong>
      </div>

      <div class="profile-field">
        <span class="profile-label">Organization</span>
        <strong id="profileOrganization">—</strong>
      </div>
    </div>
  </div>

  <div class="profile-card">
    <div class="profile-heading">
      <div>
        <h3>Security</h3>
        <p>Change the password used to sign in to this ERP account.</p>
      </div>
    </div>

    <form id="profilePasswordForm" class="password-form">
      <label>
        New Password
        <input
          id="profileNewPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </label>

      <label>
        Confirm New Password
        <input
          id="profileConfirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </label>

      <button id="profileChangePassword" type="submit">
        Change Password
      </button>
    </form>
  </div>

  <div class="profile-card danger-lite">
    <div class="profile-heading profile-logout-row">
      <div>
        <h3>Session</h3>
        <p>Sign out of Medvika ERP on this device.</p>
      </div>

      <button id="profileLogout" type="button" class="secondary-button">
        Logout
      </button>
    </div>
  </div>
</section>
