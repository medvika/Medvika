<section class="card">
  <h2>Company Settings</h2>

  <form id="companyForm">

    <div class="grid grid-2">

      <div class="form-group">
        <label>Pharmacy Name</label>
        <input id="name" type="text">
      </div>

      <div class="form-group">
        <label>Legal Name</label>
        <input id="legal_name" type="text">
      </div>

      <div class="form-group">
        <label>GSTIN</label>
        <input id="gst_number" type="text" maxlength="15" placeholder="15-character GSTIN">
      </div>

      <div class="form-group">
        <label>Registered State</label>
        <select id="registered_state">
          <option value="">Select state</option>
        </select>
      </div>

      <div class="form-group">
        <label>GST State Code</label>
        <input id="gst_state_code" type="text" maxlength="2" readonly>
      </div>

      <div class="form-group">
        <label>Drug Licence</label>
        <input id="drug_license_number" type="text">
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input id="phone" type="text">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input id="email" type="email">
      </div>

      <div class="form-group">
        <label>Address Line 1</label>
        <input id="address_line_1" type="text">
      </div>

      <div class="form-group">
        <label>Address Line 2</label>
        <input id="address_line_2" type="text">
      </div>

      <div class="form-group">
        <label>City</label>
        <input id="city" type="text">
      </div>

      <div class="form-group">
        <label>State</label>
        <input id="state" type="text">
      </div>

      <div class="form-group">
        <label>PIN Code</label>
        <input id="postal_code" type="text">
      </div>

    </div>

    <br>

    <button type="submit" class="btn btn-primary">
      Save Settings
    </button>

  </form>

</section>
