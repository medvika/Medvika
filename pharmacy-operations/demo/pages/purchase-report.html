<section class="report-module">
  <section class="erp-card">
    <div class="module-heading">
      <div><h2>Purchase Report</h2><p>Supplier-wise purchase invoices, payments and outstanding liabilities.</p></div>
      <button id="prRefresh" type="button">Refresh</button>
    </div>
    <div class="report-toolbar">
      <label>From<input id="prFrom" type="date"></label>
      <label>To<input id="prTo" type="date"></label>
      <label>Payment Status<select id="prFilter"><option value="">All</option><option value="paid">Paid</option><option value="partially_paid">Partially Paid</option><option value="unpaid">Unpaid</option><option value="cancelled">Cancelled</option></select></label>
      <div class="toolbar-actions">
        <button id="prApply" type="button">Apply</button>
        <button id="prExport" class="primary" type="button">Export CSV</button>
      </div>
    </div>
  </section>

  <section class="summary-grid">
    <div class="summary-card"><small id="prSum1Label">Metric 1</small><strong id="prSum1">0</strong></div>
    <div class="summary-card"><small id="prSum2Label">Metric 2</small><strong id="prSum2">0</strong></div>
    <div class="summary-card"><small id="prSum3Label">Metric 3</small><strong id="prSum3">0</strong></div>
    <div class="summary-card"><small id="prSum4Label">Metric 4</small><strong id="prSum4">0</strong></div>
  </section>

  <section class="erp-card">
    <div class="section-heading">
      <div><h3>Detailed Register</h3><p>Filtered report data from recorded ERP transactions.</p></div>
      <span id="prCount">0 rows</span>
    </div>
    <div class="report-search"><input id="prSearch" type="search" placeholder="Search report"></div>
    <div class="table-wrap"><table><thead id="prHead"></thead><tbody id="prBody"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody></table></div>
  </section>

  <section id="prViewPanel" class="erp-card" hidden>
    <div class="section-heading"><div><h3>Purchase Invoice</h3><p>Item-level purchase details.</p></div><div><button id="prViewPrint" type="button">Print</button> <button id="prViewClose" type="button">Close</button></div></div>
    <div id="prViewContent"></div>
  </section>
</section>
