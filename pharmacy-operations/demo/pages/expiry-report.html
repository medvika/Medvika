<section class="report-module">
  <section class="erp-card">
    <div class="module-heading">
      <div><h2>Expiry Report</h2><p>Batch-wise expiry risk with current quantity and value exposure.</p></div>
      <button id="erRefresh" type="button">Refresh</button>
    </div>
    <div class="report-toolbar">
      <label>Expiry From<input id="erFrom" type="date"></label>
      <label>Expiry To<input id="erTo" type="date"></label>
      <label>Expiry Window<select id="erFilter"><option value="">All Current Stock</option><option value="expired">Expired</option><option value="30">Upcoming ≤ 30 Days</option><option value="90">Upcoming ≤ 90 Days</option><option value="180">Upcoming ≤ 180 Days</option><option value="365">Upcoming ≤ 365 Days</option></select></label>
      <div class="toolbar-actions">
        <button id="erApply" type="button">Apply</button>
        <button id="erExport" class="primary" type="button">Export CSV</button>
      </div>
    </div>
  </section>

  <section class="summary-grid">
    <div class="summary-card"><small id="erSum1Label">Metric 1</small><strong id="erSum1">0</strong></div>
    <div class="summary-card"><small id="erSum2Label">Metric 2</small><strong id="erSum2">0</strong></div>
    <div class="summary-card"><small id="erSum3Label">Metric 3</small><strong id="erSum3">0</strong></div>
    <div class="summary-card"><small id="erSum4Label">Metric 4</small><strong id="erSum4">0</strong></div>
  </section>

  <section class="erp-card">
    <div class="section-heading">
      <div><h3>Detailed Register</h3><p>Filtered report data from recorded ERP transactions.</p></div>
      <span id="erCount">0 rows</span>
    </div>
    <div class="report-search"><input id="erSearch" type="search" placeholder="Search report"></div>
    <div class="table-wrap"><table><thead id="erHead"></thead><tbody id="erBody"><tr><td colspan="9" class="empty">Loading...</td></tr></tbody></table></div>
  </section>
</section>
