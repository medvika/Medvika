<section class="report-module">
  <section class="erp-card">
    <div class="module-heading">
      <div><h2>Return Report</h2><p>Sales and purchase returns in one operational register.</p></div>
      <button id="rrRefresh" type="button">Refresh</button>
    </div>
    <div class="report-toolbar">
      <label>From<input id="rrFrom" type="date"></label>
      <label>To<input id="rrTo" type="date"></label>
      <label>Return Type<select id="rrFilter"><option value="">All</option><option value="SALES_RETURN">Sales Return</option><option value="PURCHASE_RETURN">Purchase Return</option></select></label>
      <div class="toolbar-actions">
        <button id="rrApply" type="button">Apply</button>
        <button id="rrExport" class="primary" type="button">Export CSV</button>
      </div>
    </div>
  </section>

  <section class="summary-grid">
    <div class="summary-card"><small id="rrSum1Label">Metric 1</small><strong id="rrSum1">0</strong></div>
    <div class="summary-card"><small id="rrSum2Label">Metric 2</small><strong id="rrSum2">0</strong></div>
    <div class="summary-card"><small id="rrSum3Label">Metric 3</small><strong id="rrSum3">0</strong></div>
    <div class="summary-card"><small id="rrSum4Label">Metric 4</small><strong id="rrSum4">0</strong></div>
  </section>

  <section class="erp-card">
    <div class="section-heading">
      <div><h3>Detailed Register</h3><p>Filtered report data from recorded ERP transactions.</p></div>
      <span id="rrCount">0 rows</span>
    </div>
    <div class="report-search"><input id="rrSearch" type="search" placeholder="Search report"></div>
    <div class="table-wrap"><table><thead id="rrHead"></thead><tbody id="rrBody"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody></table></div>
  </section>
</section>
