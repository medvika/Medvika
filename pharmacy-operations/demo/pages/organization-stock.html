<section class="org-stock-page">
  <div class="org-stock-header">
    <div>
      <h2>Search Across Branches</h2>
      <p>Check medicine availability across branches in your organization. This view is read-only.</p>
    </div>
  </div>

  <div class="org-stock-search-card">
    <label for="orgStockSearch">Medicine / Generic / Composition</label>

    <div class="org-stock-search-row">
      <input
        id="orgStockSearch"
        type="search"
        placeholder="e.g. Dolo, Paracetamol..."
        autocomplete="off"
      >
      <button id="orgStockSearchButton" type="button">Search</button>
    </div>

    <p class="org-stock-help">
      Search results show availability only. Stock changes must be made from the assigned branch.
    </p>
  </div>

  <div id="orgStockMessage" class="org-stock-message" hidden></div>

  <div id="orgStockResults" class="org-stock-results"></div>
</section>
