<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medvika Audit Leads</title>
<link rel="stylesheet" href="./app.css?v=11">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#f6f8fb}.lead-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.lead-toolbar label{min-width:180px;flex:1}.lead-toolbar input,.lead-toolbar select{width:100%;box-sizing:border-box}.lead-grid{display:grid;gap:12px}.lead-card{border:1px solid #e5e7eb;border-radius:14px;padding:16px;background:#fff}.lead-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.lead-meta{color:#667085;font-size:13px;line-height:1.55;margin-top:6px}.lead-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{background:#f1f5f9;border-radius:999px;padding:4px 9px;font-size:12px}.status{border-radius:999px;padding:5px 10px;font-size:12px;text-transform:capitalize;white-space:nowrap}.status-new{background:#e8f1ff;color:#175cd3}.status-contacted{background:#fff4e5;color:#b54708}.status-qualified{background:#eef4ff;color:#3538cd}.status-quoted{background:#f4f3ff;color:#5925dc}.status-won{background:#ecfdf3;color:#027a48}.status-lost{background:#fef3f2;color:#b42318}.lead-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.detail{margin-top:14px;padding-top:14px;border-top:1px solid #eaecf0}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.detail h4{margin:0 0 5px}.muted{color:#667085}.empty{padding:30px;text-align:center}.error{color:#b42318}.file-note{font-size:12px;color:#667085}
</style>
</head>
<body>
<div class="wrap">
<div class="card top"><img src="./logo.png?v=4" class="logo" alt="Medvika Healthcare Solutions"><div><span class="eyebrow">Medvika Only</span><h1>Audit Leads</h1></div><div class="top-actions"><a class="btn secondary" href="./">Back to Admin</a><button id="logoutBtn" class="btn secondary">Sign out</button></div></div>
<div id="loginCard" class="card"><div class="grid"><label>Admin Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label></div><button id="loginBtn" class="btn primary">Admin Sign In</button><p id="loginMsg" class="muted"></p></div>
<div id="adminArea" hidden>
<div class="card"><div class="section-head"><div><span class="eyebrow">Website Enquiries</span><h2>Pharmacy Audit Leads</h2></div><button id="reloadBtn" class="btn secondary">Reload</button></div>
<div class="lead-toolbar"><label>Search<input id="search" placeholder="Business, contact, phone, city"></label><label>Status<select id="statusFilter"><option value="">All statuses</option><option>new</option><option>contacted</option><option>qualified</option><option>quoted</option><option>won</option><option>lost</option></select></label></div>
<p id="msg" class="muted"></p><div id="leadList" class="lead-grid"></div></div></div>
</div>
<script>
const SUPABASE_URL="https://etevzodzxhsdwidtrmwv.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_iKWBOAxrWTZfU6Qb5PYd5Q_0y80GEOw";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id); let leads=[];
const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
const arr=a=>Array.isArray(a)?a:[];
async function verify(){const {data,error}=await sb.rpc('medvika_is_audit_admin');if(error)throw error;if(data!==true)throw new Error('This account is not enabled as a Medvika Audit Admin.');}
async function init(){const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data?.session){$('loginCard').hidden=false;$('adminArea').hidden=true;return;}await verify();show();await load();}
function show(){$('loginCard').hidden=true;$('adminArea').hidden=false;}
$('loginBtn').onclick=async()=>{const b=$('loginBtn');b.disabled=true;b.textContent='Signing in...';try{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await verify();show();await load();}catch(e){$('loginMsg').textContent=e.message||'Unable to sign in.';}finally{b.disabled=false;b.textContent='Admin Sign In';}};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();sessionStorage.clear();location.reload()};
$('reloadBtn').onclick=load;$('search').oninput=render;$('statusFilter').onchange=load;
async function load(){ $('msg').textContent='Loading...';let q=sb.from('pharmacy_audit_leads').select('*').order('created_at',{ascending:false}).limit(200);const status=$('statusFilter').value;if(status)q=q.eq('status',status);const {data,error}=await q;if(error){$('msg').innerHTML='<span class="error">'+esc(error.message)+'</span>';return;}leads=data||[];$('msg').textContent=`${leads.length} lead${leads.length===1?'':'s'}`;render();}
function render(){const term=$('search').value.trim().toLowerCase();const rows=leads.filter(r=>!term||[r.business_name,r.contact_name,r.phone,r.email,r.city,r.area].some(v=>String(v||'').toLowerCase().includes(term)));$('leadList').innerHTML=rows.length?rows.map(card).join(''):'<div class="card empty muted">No audit leads found.</div>';document.querySelectorAll('.statusSelect').forEach(s=>s.onchange=()=>updateStatus(s.dataset.id,s.value));document.querySelectorAll('.copyPhone').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(b.dataset.phone));}
function card(r){const status=String(r.status||'new').toLowerCase();const cats=arr(r.inventory_categories);const scopes=arr(r.audit_scope);const records=arr(r.available_records);return `<div class="lead-card"><div class="lead-head"><div><h3 style="margin:0">${esc(r.business_name)}</h3><div class="lead-meta">${esc(r.contact_name)} • ${esc(r.city)}${r.area?' • '+esc(r.area):''}<br>${esc(r.phone)}${r.email?' • '+esc(r.email):''}<br>Received ${new Date(r.created_at).toLocaleString('en-IN')}</div></div><span class="status status-${esc(status)}">${esc(status)}</span></div><div class="lead-tags"><span class="tag">Inventory: ${esc(r.inventory_value_range)}</span><span class="tag">SKUs: ${esc(r.sku_range)}</span><span class="tag">${esc(r.pharmacy_type)}</span><span class="tag">Software: ${esc(r.software_status)}</span></div><div class="lead-actions"><select class="statusSelect" data-id="${esc(r.id)}"><option value="new" ${status==='new'?'selected':''}>New</option><option value="contacted" ${status==='contacted'?'selected':''}>Contacted</option><option value="qualified" ${status==='qualified'?'selected':''}>Qualified</option><option value="quoted" ${status==='quoted'?'selected':''}>Quoted</option><option value="won" ${status==='won'?'selected':''}>Won</option><option value="lost" ${status==='lost'?'selected':''}>Lost</option></select><button class="btn secondary copyPhone" data-phone="${esc(r.phone)}">Copy Phone</button>${r.phone?`<a class="btn primary" href="https://wa.me/${encodeURIComponent(r.phone.replace(/\D/g,''))}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div><details class="detail"><summary><strong>View full assessment</strong></summary><div class="detail-grid"><div><h4>Audit scope</h4><div class="muted">${scopes.length?scopes.map(esc).join(', '):'Not specified'}</div></div><div><h4>Inventory categories</h4><div class="muted">${cats.length?cats.map(esc).join(', '):'Not specified'}</div></div><div><h4>Records available</h4><div class="muted">${records.length?records.map(esc).join(', '):'None specified'}</div></div><div><h4>Timing</h4><div class="muted">${esc(r.preferred_timing||'Flexible')} ${r.preferred_audit_period?'• '+esc(r.preferred_audit_period):''}</div></div><div><h4>Staff available</h4><div class="muted">${r.staff_available==null?'Not specified':esc(r.staff_available)}</div></div><div><h4>Stock file</h4><div class="file-note">${r.stock_file_path?'Uploaded: '+esc(r.stock_file_path):'No file uploaded'}</div></div></div><div style="margin-top:12px"><h4>Additional information</h4><div class="muted">${esc(r.additional_information||'None')}</div></div></details></div>`}
async function updateStatus(id,status){const {error}=await sb.from('pharmacy_audit_leads').update({status}).eq('id',id);if(error){$('msg').textContent=error.message;return;}const x=leads.find(v=>v.id===id);if(x)x.status=status;render();}
init().catch(e=>{$('loginMsg').textContent=e.message||'Unable to load admin.'});
</script></body></html>
